<!doctype html>
<html lang="id">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icons/icon-192.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Javanese&display=swap" />
		<!-- Studio's body face. Not render-blocking (media swap): the shop never sets text in it. -->
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" media="print" onload="this.media='all'" />
		<!-- Baseline share preview. The prerender replaces these per page; without them a link to the
		     bare domain previews with no picture at all. -->
		<meta property="og:image" content="/brand/share/solivagant-share.jpg" />
		<meta name="twitter:image" content="/brand/share/solivagant-share.jpg" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="theme-color" content="#263d27" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Solivagant" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="application-name" content="Solivagant" />
		<!-- Per-page description, Open Graph, Twitter, and JSON-LD are managed at runtime
		     by react-helmet so each route has accurate, non-duplicated metadata. (Classic
		     react-helmet appends rather than replacing pre-existing tags, so static copies
		     here would double up and override per-page values.) Only the initial-paint
		     title element stays — react-helmet replaces the title cleanly per route. -->
		<title>SOLIVAGANT - Artisan Perfumery Atelier</title>
		<script>
			// The shop is dark since the 2026-10-31 redesign; Studio stays light. Decided here, before the first
			// paint, so a shop visitor does not see a light page flash before the dark one arrives.
			(function () {
				var path = window.location.pathname.replace(/^\/en(?=\/|$)/, '') || '/';
				var studio = /^\/(studio|dashboard|login|reset-password|authenticator|raw-materials?|raw-material-audit|categories|formulas|batches|production-costing|validation|accords?)(\/|$)/.test(path)
					|| /^\/mobile\/(studio|login|reset-password|authenticator|journal|raw-materials?|raw-material-audit|materials|categories|formulas|batches|production-costing|validation|validate)(\/|$)/.test(path)
					|| /^\/journal\/(new|[^/]+\/edit)$/.test(path);
				if (!studio) {
					document.documentElement.classList.add('boot-shop');
					var theme = document.querySelector('meta[name="theme-color"]');
					if (theme) theme.setAttribute('content', '#0e0c0a');
				}
			})();
		</script>
		<style>
			html {
				background: #f7f8f2;
			}

			body {
				margin: 0;
				background: #f7f8f2;
			}

			.app-boot-fallback {
				min-height: 100vh;
				box-sizing: border-box;
				display: flex;
				align-items: stretch;
				padding: 24px;
				background: linear-gradient(180deg, #f7f8f2 0%, #ffffff 100%);
				color: #263d27;
				font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			}

			.app-boot-shell {
				width: min(100%, 1180px);
				margin: auto;
				display: grid;
				gap: 18px;
			}

			.app-boot-status {
				display: flex;
				align-items: center;
				gap: 12px;
				border: 1px solid rgba(38, 61, 39, 0.12);
				border-radius: 18px;
				background: rgba(255, 255, 255, 0.86);
				padding: 16px;
				box-shadow: 0 24px 58px -46px rgba(24, 47, 27, 0.36);
			}

			.app-boot-spinner {
				width: 34px;
				height: 34px;
				flex: 0 0 auto;
				border: 3px solid rgba(38, 61, 39, 0.14);
				border-top-color: #263d27;
				border-radius: 999px;
				animation: app-boot-spin 0.9s linear infinite;
			}

			.app-boot-fallback p {
				margin: 0;
				color: #5e6a5d;
				font-size: 12px;
				font-weight: 700;
				letter-spacing: 0.16em;
				text-transform: uppercase;
			}

			.app-boot-fallback h1,
			.app-boot-fallback h2,
			.app-boot-fallback h3 {
				margin: 0;
				letter-spacing: 0;
			}

			.app-boot-fallback h1 {
				margin-top: 4px;
				color: #0b130c;
				font-size: 22px;
				font-weight: 700;
			}

			.app-boot-fallback .app-boot-description {
				margin-top: 4px;
				color: #6b7280;
				font-size: 13px;
				font-weight: 600;
				letter-spacing: 0;
				line-height: 1.45;
				text-transform: none;
			}

			.app-boot-layout {
				display: grid;
				gap: 18px;
				grid-template-columns: 260px minmax(0, 1fr);
			}

			.app-boot-panel,
			.app-boot-sidebar {
				border: 1px solid rgba(38, 61, 39, 0.12);
				border-radius: 20px;
				background: rgba(255, 255, 255, 0.78);
				padding: 18px;
				box-shadow: 0 22px 52px -46px rgba(24, 47, 27, 0.32);
			}

			.app-boot-sidebar {
				display: grid;
				gap: 12px;
				align-content: start;
			}

			.app-boot-panel {
				display: grid;
				gap: 18px;
			}

			.app-boot-row,
			.app-boot-grid {
				display: grid;
				gap: 12px;
			}

			.app-boot-grid {
				grid-template-columns: repeat(3, minmax(0, 1fr));
			}

			.app-boot-skeleton {
				display: grid;
				gap: 10px;
				border-radius: 16px;
				background: rgba(238, 242, 232, 0.72);
				padding: 14px;
			}

			.app-boot-line {
				height: 12px;
				border-radius: 999px;
				background: linear-gradient(90deg, rgba(210, 218, 202, 0.65), rgba(255, 255, 255, 0.9), rgba(210, 218, 202, 0.65));
				background-size: 240% 100%;
				animation: app-boot-shimmer 1.35s ease-in-out infinite;
			}

			.app-boot-line.short {
				width: 42%;
			}

			.app-boot-line.medium {
				width: 68%;
			}

			.app-boot-line.tall {
				height: 44px;
				border-radius: 14px;
			}

			@keyframes app-boot-spin {
				to { transform: rotate(360deg); }
			}

			@keyframes app-boot-shimmer {
				0% { background-position: 120% 0; }
				100% { background-position: -120% 0; }
			}

			@media (max-width: 760px) {
				.app-boot-fallback {
					padding: 16px;
				}

				.app-boot-layout {
					grid-template-columns: 1fr;
				}

				.app-boot-sidebar {
					display: none;
				}

				.app-boot-grid {
					grid-template-columns: 1fr;
				}
			}

			html.boot-shop,
			html.boot-shop body {
				background: #0e0c0a;
			}
			html.boot-shop .app-boot-fallback {
				background: #0e0c0a;
				color: #ede6d6;
			}
			html.boot-shop .app-boot-status,
			html.boot-shop .app-boot-panel,
			html.boot-shop .app-boot-sidebar {
				border-color: rgba(237, 230, 214, 0.14);
				border-radius: 0;
				background: #110f0c;
				box-shadow: none;
			}
			html.boot-shop .app-boot-fallback p,
			html.boot-shop .app-boot-fallback .app-boot-description {
				color: #b8af9e;
			}
			html.boot-shop .app-boot-fallback h1 {
				color: #ede6d6;
				font-family: "Cormorant Garamond", Georgia, serif;
				font-weight: 400;
			}
			html.boot-shop .app-boot-shop {
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 20px;
			}
			html.boot-shop .app-boot-fallback .app-boot-wordmark {
				margin: 0;
				color: #ede6d6;
				font-family: "Cormorant Garamond", Georgia, serif;
				font-size: 22px;
				letter-spacing: 0.32em;
			}
			html.boot-shop .app-boot-heading {
				margin: 0;
				max-width: 18ch;
				color: #ede6d6;
				font-family: "Cormorant Garamond", Georgia, serif;
				font-size: clamp(38px, 10vw, 64px);
				font-weight: 400;
				line-height: 1.05;
				text-align: center;
				white-space: pre-line;
			}
			html.boot-shop .app-boot-fallback .app-boot-lead {
				margin: 0;
				max-width: 46ch;
				color: #a39b8b;
				font-family: "Inter", system-ui, sans-serif;
				font-size: 16px;
				font-weight: 400;
				letter-spacing: normal;
				text-transform: none;
				line-height: 1.6;
				text-align: center;
			}
			html.boot-shop .app-boot-spinner {
				border-color: rgba(237, 230, 214, 0.18);
				border-top-color: #ede6d6;
			}
			html.boot-shop .app-boot-line {
				background: #161310;
			}
			@media (prefers-reduced-motion: reduce) {
				.app-boot-spinner,
				.app-boot-line {
					animation: none;
				}
			}
		</style>
	</head>
	<body>
		<div id="root">
			<noscript>
				<main class="app-boot-fallback" aria-label="Solivagant app requires JavaScript">
					<div class="app-boot-shell">
						<section class="app-boot-status">
							<div>
								<p>App initialization</p>
								<h1>JavaScript diperlukan</h1>
								<p class="app-boot-description">Aktifkan JavaScript untuk membuka storefront, studio, cart, checkout, dan tracking order.</p>
							</div>
						</section>
					</div>
				</main>
			</noscript>
		</div>
		<script>
			(function () {
				// Only the recovery screen below has words to choose between the two shops. A copy of EN_PREFIX in
				// tools/seo-artifacts.mjs: plain script in the shell cannot import it.
				var EN_PREFIX = '/en';
				var ENGLISH = window.location.pathname === EN_PREFIX || window.location.pathname.indexOf(EN_PREFIX + '/') === 0;

				function renderPublicBootFallback() {
					var root = document.getElementById('root');
					if (!root) return;

					// THE SHOP gets its own dark page: the wordmark and a spinner. Until 2026-11-03 it got Studio's
					// "APP INITIALIZATION / Loading workspace / Menyiapkan halaman, data, dan shell aplikasi." over a
					// grey sidebar skeleton — Indonesian on the English shop too — for as long as a slow phone took to
					// fetch the bundle. A per-route table of headlines sat beside it, computed and never shown, still
					// promising "Pre-order 7-14 hari". No words now: nothing to translate, nothing to go stale.
					//
					// A prerendered page carries its own headline and lead in the <noscript> slot (the build writes
					// them, marked data-boot-page, in the page's language). On a slow phone the bundle took 15-25s
					// over a spinner alone (fifth visitor audit, 13 Nov 2026): those two lines are shown under the
					// wordmark meanwhile, so the wait already says where the buyer is. Still nothing written here.
					if (document.documentElement.classList.contains('boot-shop')) {
						var pageWords = '';
						var slot = root.querySelector('noscript');
						if (slot && slot.textContent.indexOf('data-boot-page') !== -1) {
							var holder = document.createElement('div');
							holder.innerHTML = slot.textContent;
							var heading = holder.querySelector('h1');
							var lead = holder.querySelector('.app-boot-description');
							if (heading) {
								pageWords = '<h1 class="app-boot-heading">' + heading.innerHTML + '</h1>'
									+ (lead ? '<p class="app-boot-lead">' + lead.innerHTML + '</p>' : '');
							}
						}
						root.innerHTML = '<main class="app-boot-fallback app-boot-shop" role="status" aria-live="polite" aria-busy="true" aria-label="SOLIVAGANT">'
							+ '<p class="app-boot-wordmark">SOLIVAGANT</p>'
							+ pageWords
							+ '<span class="app-boot-spinner" aria-hidden="true"></span>'
							+ '</main>';
						return;
					}

					root.innerHTML = [
						'<main class="app-boot-fallback" aria-label="Memuat Studio Solivagant" role="status" aria-live="polite" aria-busy="true">',
						'  <div class="app-boot-shell">',
						'    <section class="app-boot-status">',
						'      <span class="app-boot-spinner" aria-hidden="true"></span>',
						'      <div>',
						'        <p>Studio</p>',
						'        <h1>Memuat Studio</h1>',
						'        <p class="app-boot-description">Menyiapkan halaman dan data.</p>',
						'      </div>',
						'    </section>',
						'    <section class="app-boot-layout" aria-hidden="true">',
						'      <aside class="app-boot-sidebar">',
						'        <div class="app-boot-line medium"></div>',
						'        <div class="app-boot-line tall"></div>',
						'        <div class="app-boot-line tall"></div>',
						'        <div class="app-boot-line tall"></div>',
						'      </aside>',
						'      <div class="app-boot-panel">',
						'        <div class="app-boot-skeleton">',
						'          <div class="app-boot-line short"></div>',
						'          <div class="app-boot-line medium"></div>',
						'          <div class="app-boot-line"></div>',
						'        </div>',
						'        <div class="app-boot-grid">',
						'          <div class="app-boot-skeleton"><div class="app-boot-line short"></div><div class="app-boot-line medium"></div></div>',
						'          <div class="app-boot-skeleton"><div class="app-boot-line short"></div><div class="app-boot-line medium"></div></div>',
						'          <div class="app-boot-skeleton"><div class="app-boot-line short"></div><div class="app-boot-line medium"></div></div>',
						'        </div>',
						'        <div class="app-boot-skeleton">',
						'          <div class="app-boot-line"></div>',
						'          <div class="app-boot-line"></div>',
						'          <div class="app-boot-line medium"></div>',
						'        </div>',
						'      </div>',
						'    </section>',
						'  </div>',
						'</main>',
					].join('');
				}

				renderPublicBootFallback();

				var RECOVERY_KEY = 'solivagant.pwa.module-recovery.v2';
				var MAX_RECOVERY_ATTEMPTS = 2;
				var MODULE_FAILURE_MESSAGES = [
					'Importing a module script failed',
					'Failed to fetch dynamically imported module',
					'Loading chunk',
					'Unable to preload CSS',
				];

				function getRecoveryAttempts() {
					try {
						return Number(window.sessionStorage.getItem(RECOVERY_KEY) || '0');
					} catch (error) {
						return 0;
					}
				}

				function setRecoveryAttempts(value) {
					try {
						window.sessionStorage.setItem(RECOVERY_KEY, String(value));
					} catch (error) {
						// Session storage is optional; recovery should still continue.
					}
				}

				function isModuleFailure(eventOrReason) {
					var target = eventOrReason && eventOrReason.target;
					var message = String(
						(eventOrReason && eventOrReason.message)
						|| (eventOrReason && eventOrReason.reason && eventOrReason.reason.message)
						|| eventOrReason
						|| ''
					);

					if (target && target.tagName === 'SCRIPT' && target.type === 'module') {
						return true;
					}

					return MODULE_FAILURE_MESSAGES.some(function (entry) {
						return message.indexOf(entry) !== -1;
					});
				}

				function renderManualRecovery() {
					var root = document.getElementById('root');
					if (!root) return;

					root.innerHTML = [
						'<div class="app-boot-fallback" role="alert">',
						'  <div class="app-boot-shell">',
						'    <section class="app-boot-status">',
						'      <div>',
						'        <h1>' + (ENGLISH ? 'The page did not load' : 'Cache perlu direset') + '</h1>',
						'        <p class="app-boot-description">' + (ENGLISH
							? 'Reloading did not help. Reset the cache to load the latest version.'
							: 'Refresh otomatis belum berhasil. Reset cache aplikasi untuk memuat versi terbaru.') + '</p>',
						'      </div>',
						'    <button type="button" data-reset-app-cache style="margin-top:16px;min-height:44px;border:0;border-radius:14px;background:#263d27;color:white;padding:0 18px;font-weight:800;">' + (ENGLISH ? 'Reset cache' : 'Reset cache aplikasi') + '</button>',
						'    </section>',
						'  </div>',
						'</div>',
					].join('');

					var button = root.querySelector('[data-reset-app-cache]');
					if (button) {
						button.addEventListener('click', function () {
							setRecoveryAttempts(0);
							recoverFromModuleFailure('manual reset');
						});
					}
				}

				async function clearAppRuntimeCache() {
					if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
						var registrations = await navigator.serviceWorker.getRegistrations();
						await Promise.all(registrations.map(function (registration) {
							return registration.unregister();
						}));
					}

					if (window.caches && window.caches.keys) {
						var cacheNames = await window.caches.keys();
						await Promise.all(cacheNames
							.filter(function (cacheName) {
								return cacheName.indexOf('solivagant-') === 0 || cacheName.indexOf('perfumer-studio-') === 0;
							})
							.map(function (cacheName) {
								return window.caches.delete(cacheName);
							}));
					}
				}

				async function recoverFromModuleFailure(reason) {
					if (!window.navigator.onLine) {
						return;
					}

					var attempts = getRecoveryAttempts();
					if (attempts >= MAX_RECOVERY_ATTEMPTS) {
						renderManualRecovery();
						return;
					}

					setRecoveryAttempts(attempts + 1);

					try {
						await clearAppRuntimeCache();
					} catch (error) {
						// Reload anyway. A new navigation may install the latest service worker.
					}

					var nextUrl = new URL(window.location.href);
					nextUrl.searchParams.set('pwa-recover', Date.now().toString(36));
					nextUrl.searchParams.set('reason', String(reason || 'module').slice(0, 24));
					window.location.replace(nextUrl.toString());
				}

				window.addEventListener('error', function (event) {
					if (isModuleFailure(event)) {
						event.preventDefault();
						recoverFromModuleFailure(event.message || 'module-script');
					}
				}, true);

				window.addEventListener('unhandledrejection', function (event) {
					if (isModuleFailure(event)) {
						event.preventDefault();
						recoverFromModuleFailure(event.reason || 'module-rejection');
					}
				});

				// One timer, both answers. The boot fallback still being on screen means the app never
				// started, so recover. It being GONE means the app did start — and that is the only
				// moment anything knows the budget below is not being spent on a loop.
				//
				// Without the second branch the counter only ever went up. It lives in sessionStorage and
				// was reset in exactly one place: the manual "Reset app cache" button. So a tab left open
				// across three deploys — which is a normal afternoon here — spent its two attempts on two
				// stale chunks that each recovered PERFECTLY, and met the third with a manual-recovery
				// screen instead of the shop. The cap exists to stop a reload loop; a boot that succeeded
				// is proof there is no loop.
				window.setTimeout(function () {
					var root = document.getElementById('root');
					if (root && root.querySelector('.app-boot-fallback')) {
						recoverFromModuleFailure('boot-timeout');
						return;
					}
					if (getRecoveryAttempts() > 0) {
						setRecoveryAttempts(0);
					}
				}, 14000);
			})();
		</script>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
