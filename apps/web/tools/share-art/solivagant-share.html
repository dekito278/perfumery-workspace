<!doctype html>
<!--
  The link card for the whole site: public/brand/share/solivagant-share.jpg (DEFAULT_SHARE_IMAGE in seo.js).
  Dekito, 13 Nov 2026: no photo of him, and no shelf photo. Art that says the brand instead.

  "Solivagant" is one who wanders alone. A bottle drawn as a quiet line object; its sillage rises together,
  and one ember line leaves the rest and wanders on its own until it stops just above the name. Ink, bone
  and ember are the shop's own tokens (--ng-ink, --ng-bone, --ng-ember); Cormorant Garamond and JetBrains
  Mono are the shop's own fonts.

  Generative but repeatable: the drawing is seeded. The published card is ?seed=21. To render it again,
  open this file in Chromium at a 1200x630 viewport with ?seed=21, wait for body[data-ready="1"], take a
  screenshot, and save it as JPEG (quality 88).
-->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=JetBrains+Mono:wght@400&display=swap">
<style>html,body{margin:0;background:#0e0c0a}canvas{display:block}
#t{position:absolute;right:78px;bottom:92px;text-align:right;color:#ede6d6}
#t h1{font:300 104px/0.9 'Cormorant Garamond',serif;margin:0;letter-spacing:-0.01em}
#t p{font:400 13px 'JetBrains Mono',monospace;letter-spacing:.32em;color:#9b9282;margin:22px 4px 0 0;text-transform:uppercase}
#t i{display:inline-block;width:28px;height:1px;background:#d4573a;vertical-align:middle;margin-right:14px}
</style></head><body>
<canvas id="c" width="2400" height="1260" style="width:1200px;height:630px"></canvas>
<div id="t"><h1>Solivagant</h1><p><i></i>Atelier Parfum Artisan</p></div>
<script>
const SEED = Number(new URLSearchParams(location.search).get('seed') || 21);
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R = rng(SEED);
const c = document.getElementById('c'), x = c.getContext('2d'); x.scale(2,2);
const W=1200,H=630;
// ground: ink with a warm breath of light behind the bottle
let g = x.createRadialGradient(330,470,10,330,470,620);
g.addColorStop(0,'#211b15'); g.addColorStop(.45,'#14110d'); g.addColorStop(1,'#0b0a08');
x.fillStyle=g; x.fillRect(0,0,W,H);
// smooth field: a few random sine waves
const waves=[...Array(6)].map(()=>({fx:(R()*2+.6)/420,fy:(R()*2+.6)/420,p:R()*6.28,a:R()*.8+.4}));
const field=(px,py)=>{let s=0;for(const w of waves)s+=w.a*Math.sin(px*w.fx+py*w.fy*1.3+w.p)*Math.cos(py*w.fy-px*w.fx*.7+w.p*1.7);return s;};
const ox=330, oy=392; // mouth of the bottle
function trail(n,steps,color,alpha,width,spread,lean){
  x.strokeStyle=color; x.lineWidth=width; x.globalAlpha=alpha; x.lineCap='round';
  for(let i=0;i<n;i++){
    let px=ox+(R()-.5)*6, py=oy, vx=(R()-.5)*.4, vy=-1;
    const k=R()*spread+.15, drift=lean*(R()*.8+.6);
    x.beginPath(); x.moveTo(px,py);
    for(let s=0;s<steps;s++){
      const t=s/steps;
      const ang=field(px,py)*k*(.4+t*2.2);
      vx+= (Math.sin(ang)*.22 + drift*t*.05); vy+= (-Math.cos(ang)*.05 - .012);
      const sp=Math.hypot(vx,vy); vx/=sp; vy/=sp; vx*=1.6; vy*=1.6;
      px+=vx; py+=vy; x.lineTo(px,py);
      if(py<-20||px>W+20||px<-20) break;
    }
    x.stroke();
  }
}
trail(1100,520,'#ede6d6',.028,.6,1.1,1);
trail(260,520,'#d8d0bf',.06,.5,.5,1.3);
trail(40,520,'#d4573a',.07,.6,1.3,1.1);
// the solivagant: one ember line that leaves the others and wanders alone
x.globalAlpha=.85; x.strokeStyle='#d4573a'; x.lineWidth=1.1; x.beginPath();
{let px=ox+1,py=oy,a=-Math.PI/2; x.moveTo(px,py);
 for(let s=0;s<900;s++){a+= (field(px*1.3,py*1.3)*.035) + (s>120? -.0009*Math.sin(s/90) : 0); if(s>60) a+= .0016;
  px+=Math.cos(a)*1.25; py+=Math.sin(a)*1.25; x.lineTo(px,py); if(px>W-60||py<30||(px>690&&py>372)) break;}
 x.stroke(); x.globalAlpha=1; x.fillStyle='#d4573a'; x.beginPath(); x.arc(px,py,2.4,0,7); x.fill();}
// the bottle: drawn as a quiet line object
x.globalAlpha=1; x.lineWidth=1.2; x.strokeStyle='rgba(237,230,214,.78)';
const bx=ox-46,by=oy+44,bw=92,bh=118;
x.fillStyle='rgba(237,230,214,.035)';
x.beginPath(); x.roundRect(bx,by,bw,bh,6); x.fill(); x.stroke();
x.beginPath(); x.rect(ox-11,oy+26,22,18); x.stroke();          // neck
x.beginPath(); x.roundRect(ox-17,oy+4,34,22,3); x.stroke();     // cap
x.strokeStyle='rgba(237,230,214,.25)'; x.beginPath(); x.moveTo(bx+12,by+bh*.62); x.lineTo(bx+bw-12,by+bh*.62); x.stroke(); // liquid line
x.fillStyle='rgba(212,87,58,.07)'; x.fillRect(bx+1,by+bh*.62,bw-2,bh*.38-1);
// floor line
x.strokeStyle='rgba(237,230,214,.14)'; x.beginPath(); x.moveTo(60,by+bh+.5); x.lineTo(W-60,by+bh+.5); x.stroke();
// grain
const img=x.getImageData(0,0,2400,1260),d=img.data; for(let i=0;i<d.length;i+=4){const n=(R()-.5)*10; d[i]+=n;d[i+1]+=n;d[i+2]+=n;} x.putImageData(img,0,0);
document.fonts.ready.then(()=>document.body.dataset.ready='1');
</script></body></html>
